<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>どうぶつゲーム</title>
  <!-- 物理エンジン Matter.js の読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      position: relative;
      width: 400px;
      max-width: 100%;
      text-align: center;
    }
    header {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }
    h1 {
      font-size: 1.4rem;
      color: #38bdf8;
    }
    .score-box {
      font-size: 1.1rem;
      font-weight: bold;
      background: #1e293b;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    #gameCanvas {
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }
    .gameover-screen {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #ef4444;
      border-radius: 16px;
      padding: 24px;
      display: none;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .gameover-screen h2 {
      color: #ef4444;
      margin-bottom: 12px;
      font-size: 1.6rem;
    }
    .gameover-screen p {
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <h1>🦁 どうぶつタワー</h1>
      <div class="score-box">スコア: <span id="score">0</span></div>
    </header>

    <canvas id="gameCanvas" width="400" height="550"></canvas>

    <div id="gameoverScreen" class="gameover-screen">
      <h2>GAME OVER</h2>
      <p>ボックスがいっぱいになったよ！<br>スコア: <span id="finalScore">0</span></p>
      <button onclick="restartGame()">もう一度遊ぶ</button>
    </div>
  </div>

  <script>
    // 動物の定義（小さい順：半径、スコア、絵文字、色）
    const ANIMALS = [
      { radius: 18, score: 1,  emoji: '🐥', color: '#fef08a' }, // 0: ひよこ
      { radius: 26, score: 3,  emoji: '🐱', color: '#fed7aa' }, // 1: ねこ
      { radius: 35, score: 6,  emoji: '🐶', color: '#fbcfe8' }, // 2: いぬ
      { radius: 46, score: 10, emoji: '🐰', color: '#e9d5ff' }, // 3: うさぎ
      { radius: 58, score: 15, emoji: '🦊', color: '#fed7aa' }, // 4: きつね
      { radius: 71, score: 21, emoji: '🐼', color: '#e2e8f0' }, // 5: パンダ
      { radius: 85, score: 28, emoji: '🐯', color: '#fde047' }, // 6: とら
      { radius: 100, score: 36, emoji: '🦁', color: '#fb923c' }, // 7: ライオン
      { radius: 120, score: 50, emoji: '🐘', color: '#94a3b8' }  // 8: ぞう（マックス）
    ];

    const { Engine, Render, Runner, Bodies, Composite, Constraint, Events } = Matter;

    const canvas = document.getElementById('gameCanvas');
    const engine = Engine.create();
    const world = engine.world;

    // 重力の設定
    engine.gravity.y = 1;

    // 壁と床の作成 (幅400, 高さ550)
    const wallOptions = { isStatic: true, render: { fillStyle: '#334155' } };
    const ground = Bodies.rectangle(200, 560, 400, 20, wallOptions);
    const leftWall = Bodies.rectangle(-10, 275, 20, 570, wallOptions);
    const rightWall = Bodies.rectangle(410, 275, 20, 570, wallOptions);
    Composite.add(world, [ground, leftWall, rightWall]);

    let score = 0;
    let isGameOver = false;
    let canDrop = true;
    let currentLevel = 0; // 現在落とせる動物のレベル（0〜3くらいまでランダム）

    function getRandomStartLevel() {
      return Math.floor(Math.random() * 3); // 🐥, 🐱, 🐶 のいずれか
    }

    currentLevel = getRandomStartLevel();

    // 衝突判定（同じ動物がぶつかったら進化）
    Events.on(engine, 'collisionStart', (event) => {
      const pairs = event.pairs;

      pairs.forEach((pair) => {
        const bodyA = pair.bodyA;
        const bodyB = pair.bodyB;

        if (bodyA.level !== undefined && bodyA.level === bodyB.level) {
          if (bodyA.isProcessed || bodyB.isProcessed) return;
          bodyA.isProcessed = true;
          bodyB.isProcessed = true;

          const level = bodyA.level;
          if (level < ANIMALS.length - 1) {
            // 新しい動物の座標（2つの中心の中間）
            const newX = (bodyA.position.x + bodyB.position.x) / 2;
            const newY = (bodyA.position.y + bodyB.position.y) / 2;

            // スコア加算
            score += ANIMALS[level].score * 2;
            document.getElementById('score').textContent = score;

            // 次のレベルの動物を生成
            setTimeout(() => {
              createNewAnimal(newX, newY, level + 1);
            }, 10);
          }

          // 古い動物を削除
          Composite.remove(world, [bodyA, bodyB]);
        }
      });
    });

    function createNewAnimal(x, y, level) {
      const animalData = ANIMALS[level];
      const animal = Bodies.circle(x, y, animalData.radius, {
        restitution: 0.2, // 弾力
        friction: 0.1,
        render: { fillStyle: animalData.color }
      });
      animal.level = level;
      animal.emoji = animalData.emoji;
      Composite.add(world, animal);
    }

    // タップまたはクリックで動物を落とす
    canvas.addEventListener('pointerdown', (e) => {
      if (isGameOver || !canDrop) return;

      const rect = canvas.getBoundingClientRect();
      let x = e.clientX - rect.left;
      x = Math.max(40, Math.min(360, x)); // 壁の端に行き過ぎないように制限

      createNewAnimal(x, 50, currentLevel);
      canDrop = false;
      currentLevel = getRandomStartLevel();

      // 連続タップ防止のクールダウン
      setTimeout(() => {
        canDrop = true;
      }, 500);
    });

    // ゲームオーバー判定（上部のレッドラインを超えて一定時間留まったら）
    function checkGameOver() {
      const bodies = Composite.allBodies(world);
      for (let body of bodies) {
        if (!body.isStatic && body.position.y < 80 && body.velocity.y < 0.5) {
          // 上部ラインを超えていて動きが止まっている場合
          isGameOver = true;
          document.getElementById('finalScore').textContent = score;
          document.getElementById('gameoverScreen').style.display = 'block';
          break;
        }
      }
    }

    // 独自のCanvas描画ループ（絵文字を表示するため）
    const ctx = canvas.getContext('2d');
    function renderLoop() {
      Engine.update(engine, 1000 / 60);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 上部の警戒ラインを描画
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(0, 80);
      ctx.lineTo(400, 80);
      ctx.stroke();
      ctx.setLineDash([]);

      // 壁を描画
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 0, 10, 550);
      ctx.fillRect(390, 0, 10, 550);
      ctx.fillRect(0, 540, 400, 10);

      // すべての動物ボディを描画
      const bodies = Composite.allBodies(world);
      bodies.forEach((body) => {
        if (body.level !== undefined) {
          ctx.save();
          ctx.translate(body.position.x, body.position.y);
          ctx.rotate(body.angle);

          // 丸い背景
          ctx.beginPath();
          ctx.arc(0, 0, body.circleRadius, 0, Math.PI * 2);
          ctx.fillStyle = ANIMALS[body.level].color;
          ctx.fill();
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 2;
          ctx.stroke();

          // 絵文字
          ctx.font = `${body.circleRadius * 1.1}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(body.emoji, 0, 2);

          ctx.restore();
        }
      });

      // 操作中のプレビュー（マウス位置）を上部に表示
      if (!isGameOver && canDrop) {
        ctx.save();
        ctx.fillStyle = ANIMALS[currentLevel].color;
        ctx.beginPath();
        ctx.arc(200, 30, ANIMALS[currentLevel].radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = `${ANIMALS[currentLevel].radius * 0.7}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ANIMALS[currentLevel].emoji, 200, 32);
        ctx.restore();
      }

      if (!isGameOver) {
        checkGameOver();
      }

      requestAnimationFrame(renderLoop);
    }

    function restartGame() {
      // 動的オブジェクトをすべて削除
      const bodies = Composite.allBodies(world);
      bodies.forEach(body => {
        if (!body.isStatic) {
          Composite.remove(world, body);
        }
      });

      score = 0;
      isGameOver = false;
      document.getElementById('score').textContent = score;
      document.getElementById('gameoverScreen').style.display = 'none';
      currentLevel = getRandomStartLevel();
    }

    // ゲーム開始
    renderLoop();
  </script>
</body>
</html>
